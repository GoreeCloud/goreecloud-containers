name: Temporary PR 4 formatter

on:
  push:
    branches:
      - development/image-bundle-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-pr4-formatter
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: development/image-bundle-integration
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Format workspace
        run: cargo fmt --all

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "GoreeCloud Automation"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
          git add crates/goreecloud-containers-engine/src/lib.rs
          git commit -m "Format image-to-bundle engine source"
          git push origin HEAD:development/image-bundle-integration
